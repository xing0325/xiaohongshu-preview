<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>01 · 封面 · bypass-pet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0E12; --paper:#171720; --tile:#1F1F2A;
    --ink:#E8E2D5; --ink-soft:#A39C8E; --ink-faint:#6B6557;
    --red:#C4413A; --red-hot:#E5572F; --red-deep:#7A1212;
    --yellow:#F2C94C; --green:#7A8475; --term:#5FB35A;
    --line:rgba(232,226,213,0.1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    width:1242px;height:1656px;overflow:hidden;
    font-family:'Noto Sans SC','Inter',sans-serif;color:var(--ink);
    background:
      radial-gradient(80% 70% at 50% 40%, #1c1c26 0%, #0E0E12 70%, #050507 100%);
    position:relative;
  }
  body::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1.2px),
      radial-gradient(rgba(0,0,0,0.4) 1px, transparent 1.4px);
    background-size:5px 5px, 9px 9px;
    background-position:0 0, 2px 3px;
    opacity:.6;
  }

  .topbar{
    position:absolute;top:60px;left:90px;right:90px;
    display:flex;justify-content:space-between;align-items:center;
    font-family:'JetBrains Mono',monospace;
    font-size:22px;letter-spacing:.16em;color:var(--ink-faint);
  }
  .topbar .tag{padding:6px 14px;border:1px solid var(--ink-faint);border-radius:2px}
  .topbar .num{color:var(--red);font-weight:700}

  /* allow button mockup */
  .allow{
    position:absolute;left:50%;top:280px;transform:translateX(-50%) rotate(-3deg);
    width:780px;padding:34px 50px;
    background:var(--paper);border:2px solid var(--ink-faint);
    border-radius:14px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.7);
    font-family:'JetBrains Mono',monospace;
  }
  .allow .row{display:flex;align-items:center;gap:18px;margin-bottom:16px}
  .allow .dot{width:14px;height:14px;border-radius:50%;background:#ff5f57}
  .allow .dot.y{background:#febc2e}
  .allow .dot.g{background:#28c840}
  .allow .ask{
    color:var(--ink);font-size:30px;line-height:1.4;font-weight:500;
    font-family:'Noto Sans SC',sans-serif;letter-spacing:.02em;
    margin-bottom:32px;
  }
  .allow .cmd{
    color:var(--term);font-size:24px;margin-bottom:24px;
    padding:14px 18px;background:#0c0c10;border-radius:6px;
    border-left:3px solid var(--term);
  }
  .allow .btns{display:flex;gap:14px;justify-content:flex-end}
  .allow .btn{
    padding:14px 28px;border-radius:8px;font-size:22px;font-weight:600;
    font-family:'Noto Sans SC',sans-serif;letter-spacing:.04em;
  }
  .btn-deny{background:#2a2a35;color:var(--ink-soft);border:1px solid var(--line)}
  .btn-allow{
    background:linear-gradient(180deg,#3a82ff 0%,#1f5fd6 100%);
    color:#fff;border:1px solid #1846a7;
    position:relative;
  }

  /* big red strike on the allow button */
  .strike{
    position:absolute;left:50%;top:540px;transform:translateX(-50%) rotate(-12deg);
    width:560px;height:120px;
    background:var(--red);
    box-shadow:
      0 0 0 4px var(--red-deep),
      0 18px 32px -8px rgba(0,0,0,0.7);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Bowlby One SC','Noto Sans SC',sans-serif;
    color:var(--ink);font-size:84px;letter-spacing:.04em;
    text-shadow:0 3px 0 var(--red-deep);
  }
  .strike::before, .strike::after{
    content:"";position:absolute;top:50%;height:2px;
    background:rgba(232,226,213,0.45);width:80px;
  }
  .strike::before{left:-100px;transform:translateY(-50%)}
  .strike::after{right:-100px;transform:translateY(-50%)}

  .headline-wrap{
    position:absolute;left:90px;right:90px;top:790px;
  }
  .pre{
    font-family:'JetBrains Mono',monospace;
    font-size:24px;letter-spacing:.2em;color:var(--red-hot);
    text-transform:uppercase;margin-bottom:24px;
  }
  .pre::before{
    content:"// ";color:var(--ink-faint);
  }
  .headline{
    font-family:'Noto Sans SC',sans-serif;
    font-weight:900;font-size:144px;line-height:1.05;
    color:var(--ink);letter-spacing:-.01em;
    text-shadow:0 4px 0 rgba(0,0,0,0.4);
  }
  .headline .em{color:var(--red-hot)}
  .headline .quote{
    color:var(--yellow);font-family:'Noto Serif SC',serif;font-weight:700;
    font-style:italic;
  }

  .subline{
    position:absolute;left:90px;right:90px;top:1310px;
    font-family:'Noto Sans SC',sans-serif;font-weight:500;
    font-size:38px;line-height:1.5;color:var(--ink-soft);
    letter-spacing:.02em;
  }
  .subline .pipe{color:var(--red);margin:0 14px}

  .footer{
    position:absolute;bottom:60px;left:90px;right:90px;
    display:flex;justify-content:space-between;align-items:flex-end;
    font-family:'JetBrains Mono',monospace;color:var(--ink-faint);
    font-size:22px;letter-spacing:.1em;
  }
  .footer .left b{color:var(--ink)}
  .footer .right{text-align:right}

  /* tiny pixel ball */
  .ball{
    position:absolute;left:90px;top:520px;
    width:96px;height:96px;border-radius:50%;
    background:radial-gradient(circle at 32% 32%, #d96b62, #C4413A 50%, #7A1212 100%);
    box-shadow:
      inset 0 -8px 16px rgba(0,0,0,0.4),
      0 0 0 4px var(--yellow),
      0 16px 32px -10px rgba(0,0,0,0.7);
    display:flex;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif;font-weight:900;font-size:18px;
    color:var(--yellow);letter-spacing:.06em;
  }
  .ball span{transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="topbar">
    <span class="tag">CLAUDE CODE · DESKTOP</span>
    <span><span class="num">01</span> / 09</span>
  </div>

  <div class="allow">
    <div class="row">
      <div class="dot"></div><div class="dot y"></div><div class="dot g"></div>
    </div>
    <div class="ask">Claude wants to run a command:</div>
    <div class="cmd">$ git push origin main</div>
    <div class="btns">
      <div class="btn btn-deny">Deny</div>
      <div class="btn btn-allow">Allow</div>
    </div>
  </div>

  <div class="strike">CANCELLED</div>

  <div class="ball"><span>BYPASS</span></div>

  <div class="headline-wrap">
    <div class="pre">Build in Public · 2026-05-21</div>
    <div class="headline">
      Claude 每次都问<br>
      <span class="quote">"允许吗"</span> · <span class="em">我让它别问了</span>
    </div>
  </div>

  <div class="subline">
    写了个 hook 终结那个按钮 <span class="pipe">|</span> 顺便给 Claude 配了只像素桌宠
  </div>

  <div class="footer">
    <div class="left">xing0325 · <b>build in public</b> · vibe coding</div>
    <div class="right">两个仓库 · 一条命令<br>评论区取链接</div>
  </div>
</body>
</html>
